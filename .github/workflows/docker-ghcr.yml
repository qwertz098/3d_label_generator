# CI/CD: run the tests, then build the Docker image and push it to GHCR.
#
# Currently NOT activated: the workflow only runs when started by hand
# (Actions tab -> "CI/CD (GHCR)" -> "Run workflow").
# To activate it, uncomment the `push` / `pull_request` triggers below.
# Pull requests only run the tests and build the image; they never push it.

name: CI/CD (GHCR)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   tags: ["v*"]
  # pull_request:
  #   branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for CadQuery
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download fonts
        run: python download_fonts.py

      - name: Run tests
        run: python test_label_generation.py

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
